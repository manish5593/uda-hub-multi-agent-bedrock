# Alembic: one section, and one migration history, per service database (see migrations/common.py).
# The database URL comes from the section's environment variable (CULTPASS_DB_URL, TICKETS_DB_URL,
# KNOWLEDGE_DB_URL). From the repository root:
#
#   python -m service.scripts.migrate                                   # upgrade all three (the migrate job)
#   alembic -c service/alembic.ini -n tickets current                   # one database's revision
#   alembic -c service/alembic.ini -n tickets revision --autogenerate -m "add ticket priority"
#   alembic -c service/alembic.ini -n tickets downgrade -1

[DEFAULT]
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os

[cultpass]
script_location = %(here)s/migrations/cultpass

[tickets]
script_location = %(here)s/migrations/tickets

[knowledge]
script_location = %(here)s/migrations/knowledge
