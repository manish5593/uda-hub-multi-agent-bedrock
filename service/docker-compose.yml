# UDA-Hub as microservices. From the service/ folder:
#   cp .env.example .env   # then fill it in: secrets, model settings, and optionally email
#   docker compose up --build
#   docker compose --profile monitoring up --build        # also Prometheus (:9090) and Grafana (:3000)
#   docker compose --profile langfuse up --build          # also Langfuse LLM tracing (:3001)
# Only the gateway is published (port 8080); everything else is on the internal network.
name: udahub

x-backend: &backend
  build:
    context: ..
    dockerfile: service/Dockerfile
  image: udahub-backend:latest
  restart: unless-stopped
  networks: [internal]

x-healthcheck: &healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

x-common-env: &common-env
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in service/.env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# Everything comes from the one service/.env, and each service gets only what it needs: the model settings and
# credentials go to the agent and knowledge services, the email settings to the auth and agent services.
# Settings left blank fall back to the defaults in solution/agentic/config.py.
x-llm-env: &llm-env
  UDAHUB_LLM_PROVIDER: ${UDAHUB_LLM_PROVIDER:-openai}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  UDAHUB_CHAT_MODEL: ${UDAHUB_CHAT_MODEL:-}
  UDAHUB_EMBEDDING_PROVIDER: ${UDAHUB_EMBEDDING_PROVIDER:-}
  UDAHUB_EMBEDDING_MODEL: ${UDAHUB_EMBEDDING_MODEL:-}
  UDAHUB_SAGEMAKER_ENDPOINT: ${UDAHUB_SAGEMAKER_ENDPOINT:-}
  UDAHUB_RAG_MIN_SCORE: ${UDAHUB_RAG_MIN_SCORE:-}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

x-email-env: &email-env
  UDAHUB_EMAIL_PROVIDER: ${UDAHUB_EMAIL_PROVIDER:-log}
  UDAHUB_EMAIL_FROM: ${UDAHUB_EMAIL_FROM:-}
  UDAHUB_EMAIL_LOG_FALLBACK: ${UDAHUB_EMAIL_LOG_FALLBACK:-true}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

services:
  # Postgres 16 with pgvector (postgres/Dockerfile): the knowledge service keeps its embeddings there
  db:
    build: ./postgres
    image: udahub-postgres:16-pgvector
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in service/.env}
      CULTPASS_DB_PASSWORD: ${CULTPASS_DB_PASSWORD:?}
      TICKETS_DB_PASSWORD: ${TICKETS_DB_PASSWORD:?}
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD:?}
      AGENT_STATE_DB_PASSWORD: ${AGENT_STATE_DB_PASSWORD:?}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in service/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # One-shot job: creates any missing service database and login role (the init script only runs when the
  # volume is first created, so this is how a database added later reaches an existing volume)
  db-setup:
    image: postgres:16-alpine
    restart: "no"
    entrypoint: ["bash", "/init-databases.sh"]
    environment:
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      CULTPASS_DB_PASSWORD: ${CULTPASS_DB_PASSWORD}
      TICKETS_DB_PASSWORD: ${TICKETS_DB_PASSWORD}
      KNOWLEDGE_DB_PASSWORD: ${KNOWLEDGE_DB_PASSWORD}
      AGENT_STATE_DB_PASSWORD: ${AGENT_STATE_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
    volumes:
      - ./postgres/init-databases.sh:/init-databases.sh:ro
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]

  # One-shot job: brings every service database to the latest schema (Alembic, service/migrations)
  migrate:
    <<: *backend
    restart: "no"
    command: ["python", "-m", "service.scripts.migrate"]
    environment: &service-db-urls
      CULTPASS_DB_URL: postgresql+psycopg://cultpass_svc:${CULTPASS_DB_PASSWORD}@db:5432/cultpass
      TICKETS_DB_URL: postgresql+psycopg://tickets_svc:${TICKETS_DB_PASSWORD}@db:5432/tickets
      KNOWLEDGE_DB_URL: postgresql+psycopg://knowledge_svc:${KNOWLEDGE_DB_PASSWORD}@db:5432/knowledge
      AUTH_DB_URL: postgresql+psycopg://auth_svc:${AUTH_DB_PASSWORD}@db:5432/auth
    depends_on:
      db-setup: {condition: service_completed_successfully}

  # One-shot job: loads the demo data into empty tables
  seed:
    <<: *backend
    restart: "no"
    command: ["python", "-m", "service.scripts.seed"]
    environment: *service-db-urls
    # Your own demo customers (git-ignored, see local/README.md); only the seed job sees them
    volumes:
      - ./local:/app/service/local:ro
    depends_on:
      migrate: {condition: service_completed_successfully}

  cultpass:
    <<: *backend
    command: ["uvicorn", "service.cultpass_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *common-env
      CULTPASS_DB_URL: postgresql+psycopg://cultpass_svc:${CULTPASS_DB_PASSWORD}@db:5432/cultpass
    healthcheck: *healthcheck
    depends_on:
      seed: {condition: service_completed_successfully}

  tickets:
    <<: *backend
    command: ["uvicorn", "service.ticket_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *common-env
      UDAHUB_DB_URL: postgresql+psycopg://tickets_svc:${TICKETS_DB_PASSWORD}@db:5432/tickets
    healthcheck: *healthcheck
    depends_on:
      seed: {condition: service_completed_successfully}

  knowledge:
    <<: *backend
    command: ["uvicorn", "service.knowledge_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # Embedding model settings and credentials
      <<: [*common-env, *llm-env]
      UDAHUB_DB_URL: postgresql+psycopg://knowledge_svc:${KNOWLEDGE_DB_PASSWORD}@db:5432/knowledge
      # Article embeddings in Postgres (pgvector) instead of in memory; "memory" switches back
      UDAHUB_VECTOR_STORE: ${UDAHUB_VECTOR_STORE:-pgvector}
    healthcheck: *healthcheck
    depends_on:
      seed: {condition: service_completed_successfully}

  # Customer sign-up and login: issues the JWTs the gateway verifies
  auth:
    <<: *backend
    command: ["uvicorn", "service.auth_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # Sending codes by email
      <<: [*common-env, *email-env]
      AUTH_DB_URL: postgresql+psycopg://auth_svc:${AUTH_DB_PASSWORD}@db:5432/auth
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in service/.env (at least 32 characters)}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      CULTPASS_SERVICE_URL: http://cultpass:8000
    healthcheck: *healthcheck
    depends_on:
      migrate: {condition: service_completed_successfully}
      cultpass: {condition: service_healthy}

  agent:
    <<: *backend
    command: ["uvicorn", "service.agent_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      # Chat model settings and credentials, and sending codes by email
      <<: [*common-env, *llm-env, *email-env]
      CULTPASS_SERVICE_URL: http://cultpass:8000
      TICKET_SERVICE_URL: http://tickets:8000
      KNOWLEDGE_SERVICE_URL: http://knowledge:8000
      AGENT_STATE_DB_URL: postgresql://agent_state_svc:${AGENT_STATE_DB_PASSWORD}@db:5432/agent_state
      # Langfuse tracing: on when both keys are set in .env (run with --profile langfuse), off when they are empty
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_TRACING_ENVIRONMENT: docker
    volumes:
      - agent-logs:/app/logs
    healthcheck: *healthcheck
    depends_on:
      db: {condition: service_healthy}
      cultpass: {condition: service_healthy}
      tickets: {condition: service_healthy}
      knowledge: {condition: service_healthy}

  gateway:
    build:
      context: ..
      dockerfile: service/gateway/Dockerfile
    image: udahub-gateway:latest
    restart: unless-stopped
    environment:
      <<: *common-env
      GATEWAY_API_KEYS: ${GATEWAY_API_KEYS:?set GATEWAY_API_KEYS in service/.env}
      GATEWAY_RATE_LIMIT_PER_MINUTE: ${GATEWAY_RATE_LIMIT_PER_MINUTE:-30}
      GATEWAY_AUTH_RATE_LIMIT_PER_MINUTE: ${GATEWAY_AUTH_RATE_LIMIT_PER_MINUTE:-10}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in service/.env (at least 32 characters)}
      AGENT_SERVICE_URL: http://agent:8000
      TICKET_SERVICE_URL: http://tickets:8000
      AUTH_SERVICE_URL: http://auth:8000
    ports:
      - "${GATEWAY_PORT:-8080}:8000"
    healthcheck: *healthcheck
    depends_on:
      agent: {condition: service_healthy}
      auth: {condition: service_healthy}
    networks: [internal]

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks: [internal]

  # Dashboards: http://localhost:3000, user admin. The datasource and the UDA-Hub dashboard are provisioned
  # from monitoring/grafana, so they come back whenever the container is recreated.
  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.2.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/udahub.json
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    networks: [internal]

  # LLM tracing: http://localhost:3001. Langfuse web and worker plus the stores they need: their own Postgres,
  # ClickHouse (traces), Redis (queue) and MinIO (raw events). Adapted from Langfuse's docker-compose.yml
  # (v4.78.0): only the web UI is published, on localhost. The organisation, project, API keys and admin user
  # are created on first start from the LANGFUSE_* values in .env, so the agent can send traces right away.
  langfuse-worker:
    profiles: [langfuse]
    image: langfuse/langfuse-worker:4.78.0
    restart: unless-stopped
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3001}
      DATABASE_URL: postgresql://postgres:${LANGFUSE_DB_PASSWORD:-}@langfuse-db:5432/postgres
      SALT: ${LANGFUSE_SALT:-}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:-}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:-}
    depends_on: &langfuse-depends-on
      langfuse-db: {condition: service_healthy}
      langfuse-clickhouse: {condition: service_healthy}
      langfuse-redis: {condition: service_healthy}
      langfuse-minio: {condition: service_healthy}
    networks: [internal]

  langfuse-web:
    profiles: [langfuse]
    image: langfuse/langfuse:4.78.0
    restart: unless-stopped
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-}
      LANGFUSE_INIT_ORG_ID: udahub
      LANGFUSE_INIT_ORG_NAME: UDA-Hub
      LANGFUSE_INIT_PROJECT_ID: udahub
      LANGFUSE_INIT_PROJECT_NAME: UDA-Hub agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:-admin@udahub.local}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:-}
      AUTH_DISABLE_SIGNUP: "true"
    ports:
      - "127.0.0.1:${LANGFUSE_PORT:-3001}:3000"
    depends_on: *langfuse-depends-on
    networks: [internal]

  langfuse-db:
    profiles: [langfuse]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [internal]

  langfuse-clickhouse:
    profiles: [langfuse]
    image: clickhouse/clickhouse-server:26.3.62.3
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:-}
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  langfuse-redis:
    profiles: [langfuse]
    image: redis:7.4.9-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD:-}", "--maxmemory-policy", "noeviction"]
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD:-}", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    networks: [internal]

  # Chainguard publishes only a rolling tag for MinIO; this is the image Langfuse's own compose file uses
  langfuse-minio:
    profiles: [langfuse]
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    entrypoint: sh
    # Create the 'langfuse' bucket before starting the server
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:-}
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks: [internal]

networks:
  internal: {}

volumes:
  pgdata: {}
  agent-logs: {}
  grafana-data: {}
  langfuse-pgdata: {}
  langfuse-clickhouse-data: {}
  langfuse-clickhouse-logs: {}
  langfuse-redis-data: {}
  langfuse-minio-data: {}
